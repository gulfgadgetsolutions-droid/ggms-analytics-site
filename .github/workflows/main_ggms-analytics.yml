# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ggms-analytics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install, check, and build
        env:
          NEXT_PUBLIC_SITE_URL: https://ggms-analytics-hwbnc8bpdncyfmeh.southindia-01.azurewebsites.net
        run: |
          npm ci
          npm run lint
          npm run test:content
          node scripts/contact-mail-audit.mjs
          npm run build

      - name: Package the Next.js application
        run: |
          test -f .next/BUILD_ID
          zip -q -r release.zip .next public node_modules package.json package-lock.json next.config.ts -x '.next/cache/*'
          unzip -l release.zip | grep '.next/BUILD_ID'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8EA4F6AAD63F417DA17CACB34D20117B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_079753CF8B524E07A0022C4E916D20CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F46E802C29A54F3789716520E1247C83 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ggms-analytics'
          slot-name: 'Production'
          package: release.zip
          startup-command: 'node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port ${PORT:-8080}'

